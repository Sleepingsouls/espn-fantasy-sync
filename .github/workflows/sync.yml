name: Refresh ESPN fantasy data

on:
  workflow_dispatch:
  schedule:
    # Daily at 7:45 AM MDT, before the 8 AM analysis
    - cron: '45 13 * * *'

    # Thu/Fri/Sat at 6:45 PM MDT, before the 7 PM analysis
    # These are Fri/Sat/Sun in UTC
    - cron: '45 0 * * 5,6,0'

    # Sunday at 9:45 AM, 12:45 PM, 4:45 PM MDT
    - cron: '45 15 * * 0'
    - cron: '45 18 * * 0'
    - cron: '45 22 * * 0'
    
permissions:
  contents: write

concurrency:
  group: espn-fantasy-sync
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and sanitize league state
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: "1749747321"
          ESPN_SEASON: "2026"
          FREE_AGENT_LIMIT: "250"
        run: python src/sync.py

      - name: Add executed transaction history
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: "1749747321"
          ESPN_SEASON: "2026"
        run: python src/enrich_transactions.py

      - name: Secondary credential leak check
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          text = Path("docs/fantasy-state.json").read_text(encoding="utf-8")

          for name in ("ESPN_S2", "ESPN_SWID"):
              secret = os.environ.get(name, "")
              if secret and secret in text:
                  raise SystemExit(
                      f"Refusing to publish: {name} appeared in sanitized JSON"
                  )

          print("Credential leak check passed.")
          PY

      - name: Push fantasy state to Supabase
        env:
          SUPABASE_URL: https://jiqwgjludmpqssthxkxf.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          with open("docs/fantasy-state.json", "r", encoding="utf-8") as f:
              state = json.load(f)

          payload = {
              "id": "current",
              "state": state,
              "generated_at_utc": state.get("generated_at_utc"),
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }

          request = Request(
              f"{os.environ['SUPABASE_URL']}/rest/v1/fantasy_state",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "apikey": os.environ["SUPABASE_SECRET_KEY"],
                  "Content-Type": "application/json",
                  "Prefer": "resolution=merge-duplicates,return=minimal",
              },
          )

          try:
              with urlopen(request, timeout=30) as response:
                  print(f"Supabase fantasy sync succeeded: HTTP {response.status}")
          except HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"Supabase fantasy sync failed: HTTP {exc.code}: {body}"
              )
          PY

      - name: Commit refreshed public data
        run: |
          if git diff --quiet -- docs/fantasy-state.json; then
            echo "No fantasy data changes to commit."
            exit 0
          fi

          git config user.name "espn-fantasy-sync[bot]"
          git config user.email "espn-fantasy-sync[bot]@users.noreply.github.com"

          git add docs/fantasy-state.json
          git commit -m "Refresh fantasy league state"
          git push
